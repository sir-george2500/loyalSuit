spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      ssl:
        enabled: false

cloudinary:
  cloud-name: test
  api-key: test
  api-secret: test

app:
  jwt:
    secret: test-only-jwt-secret-key-that-is-at-least-32-bytes-long-0123456789
    expiration-seconds: 3600
  # Off by default so the suite isn't throttled; the rate-limit test re-enables it
  # with low limits via @SpringBootTest(properties = ...).
  rate-limit:
    enabled: false

# Logging is configured by logback-spring.xml (the "test" springProfile block).
