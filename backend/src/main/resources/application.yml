spring:
  application:
    name: loyalsuit-backend

  servlet:
    multipart:
      # Hard boundary for uploads — rejects oversized requests before they reach
      # any controller. The media service additionally re-checks size and content.
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DATABASE}?sslmode=require
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: LoyalSuitPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # Flyway needs a direct (non-pooled) connection for DDL statements
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DATABASE}?sslmode=require
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USER}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  cache:
    type: redis
    redis:
      time-to-live: 600000

  mail:
    host: ${EMAIL_HOST:}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USER:}
    password: ${EMAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${EMAIL_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    # Transactional email sender identity. Sending is best-effort: a missing or
    # failing SMTP config logs a warning but never breaks the request.
    from: ${EMAIL_FROM:no-reply@loyalsuit.local}
    from-name: ${EMAIL_FROM_NAME:LoyalSuit}
  jwt:
    # Self-contained auth: the platform signs its own tokens. Use a long random
    # value (>= 32 chars) in production via the APP_JWT_SECRET env var.
    secret: ${APP_JWT_SECRET:change-me-in-production-this-is-a-dev-only-secret-key-0123456789}
    expiration-seconds: ${APP_JWT_EXPIRATION:86400}
  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:3000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  info:
    title: LoyalSuit API
    version: v1
    description: Multivendor ECommerce & POS Platform API

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Redis is an optional cache, not a hard dependency. A flaky RedisLabs
    # connection must not flip the whole app to DOWN or fail readiness.
    redis:
      enabled: false

# Logging levels, patterns, file rotation and per-profile config live in
# src/main/resources/logback-spring.xml (single source of truth).
